name: dart2tinygo
description: >-
  Transpiles a subset of Dart into TinyGo source code so it can run on
  microcontrollers. CLI (`dart2tinygo build/check`) plus the conversion engine.
version: 0.0.2
repository: https://github.com/o-ga09/dart2tinygo
issue_tracker: https://github.com/o-ga09/dart2tinygo/issues
topics:
  - embedded
  - tinygo
  - microcontroller

environment:
  sdk: ^3.6.0
resolution: workspace

executables:
  dart2tinygo:

dependencies:
  analyzer: ^12.1.0
  args: ^2.6.0
  path: ^1.9.1

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
  # Board-agnostic fake binding for golden/checker tests; the core itself
  # never depends on a real board package. Resolved in-tree by the workspace
  # (it is never published).
  test_binding: ^0.0.2