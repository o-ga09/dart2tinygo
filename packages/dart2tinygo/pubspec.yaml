name: dart2tinygo
description: >
  Dart のサブセットを TinyGo のソースコードに変換する CLI + 変換エンジン。
  v0.1 最小変換（void main + while + sleep + print）を実装済み。
version: 0.0.0
publish_to: none
repository: https://github.com/o-ga09/dart2tinygo
topics:
  - embedded
  - tinygo
  - microcontroller

environment:
  sdk: ^3.0.0

dependencies:
  analyzer: ^12.1.0
  args: ^2.6.0
  path: ^1.9.1

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
