name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: dart analyze / dart test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/dart2tinygo
          - packages/tinygo_annotations
          - packages/tinygo_machine
          - packages/wio_terminal
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: dart pub get
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze
      # Binding/annotation packages are declarations only and have no tests;
      # `dart test` exits 65 without a test/ dir and a package:test dev dep.
      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          if [ -d test ]; then
            dart test
          else
            echo "no test/ directory in ${{ matrix.package }}; skipping"
          fi

  tinygo-compile:
    name: TinyGo compile test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wioterminal, pico]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      # TinyGo 0.42 requires Go 1.25–1.27; the runner default is older.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.42.0"
      - name: Install dependencies
        working-directory: packages/dart2tinygo
        run: dart pub get
      - name: dart2tinygo build (v0.1 minimal golden case)
        working-directory: packages/dart2tinygo
        run: dart run bin/dart2tinygo.dart build test/golden/minimal_blink.dart -o /tmp/dart2tinygo-out
      - name: tinygo build -target=${{ matrix.target }}
        working-directory: /tmp/dart2tinygo-out
        run: tinygo build -target=${{ matrix.target }} -o firmware.bin .
      # Board-specific examples only build for their own target.
      - name: dart2tinygo build (examples/hello_wioterminal)
        if: matrix.target == 'wioterminal'
        run: |
          dart pub get -C examples/hello_wioterminal
          cd packages/dart2tinygo
          dart run bin/dart2tinygo.dart build ../../examples/hello_wioterminal/main.dart -o /tmp/dart2tinygo-hello-out
      - name: tinygo build examples/hello_wioterminal
        if: matrix.target == 'wioterminal'
        working-directory: /tmp/dart2tinygo-hello-out
        run: tinygo build -target=${{ matrix.target }} -o firmware.bin .
