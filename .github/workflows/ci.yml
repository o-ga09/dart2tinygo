name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: dart analyze / dart test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/dart2tinygo
          - packages/tinygo_annotations
          - packages/tinygo_machine
          - packages/wio_terminal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      # Pub workspace: one `dart pub get` at the root resolves every package.
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze
      # Binding/annotation packages are declarations only and have no tests;
      # `dart test` exits 65 without a test/ dir and a package:test dev dep.
      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          if [ -d test ]; then
            dart test
          else
            echo "no test/ directory in ${{ matrix.package }}; skipping"
          fi

  tinygo-compile:
    name: TinyGo compile test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wioterminal, pico]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      # TinyGo 0.42 requires Go 1.25–1.27; the runner default is older.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3.0.1
        with:
          tinygo-version: "0.42.0"
      - name: Install dependencies
        run: dart pub get
      - name: go test packages/dart2tinygo/go (dartrt)
        working-directory: packages/dart2tinygo/go
        run: go test ./...
      - name: dart2tinygo build (v0.1 minimal golden case)
        working-directory: packages/dart2tinygo
        run: dart run bin/dart2tinygo.dart build test/golden/minimal_blink.dart -o /tmp/dart2tinygo-out
      - name: tinygo build -target=${{ matrix.target }}
        working-directory: /tmp/dart2tinygo-out
        run: tinygo build -target=${{ matrix.target }} -o firmware.bin .
      # Exercises the dartrt runtime (packages/dart2tinygo/go/): int
      # arithmetic, `~/`, `%`.
      - name: dart2tinygo build (int_arithmetic golden case)
        working-directory: packages/dart2tinygo
        run: dart run bin/dart2tinygo.dart build test/golden/int_arithmetic.dart -o /tmp/dart2tinygo-arith-out
      - name: tinygo build -target=${{ matrix.target }} (int_arithmetic)
        working-directory: /tmp/dart2tinygo-arith-out
        run: tinygo build -target=${{ matrix.target }} -o firmware.bin .
      # Exercises dartrt.FormatDouble and math.Round (double arithmetic,
      # .toDouble()/.toInt()/.round()).
      - name: dart2tinygo build (double_conversion golden case)
        working-directory: packages/dart2tinygo
        run: dart run bin/dart2tinygo.dart build test/golden/double_conversion.dart -o /tmp/dart2tinygo-double-out
      - name: tinygo build -target=${{ matrix.target }} (double_conversion)
        working-directory: /tmp/dart2tinygo-double-out
        run: tinygo build -target=${{ matrix.target }} -o firmware.bin .
      # Exercises List<int>/[]byte and String operations (index read/write,
      # add, length, codeUnits, fromCharCodes, substring).
      - name: dart2tinygo build (list_int_string golden case)
        working-directory: packages/dart2tinygo
        run: dart run bin/dart2tinygo.dart build test/golden/list_int_string.dart -o /tmp/dart2tinygo-list-out
      - name: tinygo build -target=${{ matrix.target }} (list_int_string)
        working-directory: /tmp/dart2tinygo-list-out
        run: tinygo build -target=${{ matrix.target }} -o firmware.bin .
      # Exercises switch/case/default (int/String/bool scrutinees, grouped
      # empty cases, an empty case falling into default).
      - name: dart2tinygo build (switch_case golden case)
        working-directory: packages/dart2tinygo
        run: dart run bin/dart2tinygo.dart build test/golden/switch_case.dart -o /tmp/dart2tinygo-switch-out
      - name: tinygo build -target=${{ matrix.target }} (switch_case)
        working-directory: /tmp/dart2tinygo-switch-out
        run: tinygo build -target=${{ matrix.target }} -o firmware.bin .
      # Exercises top-level functions beyond main: parameters, return,
      # expression bodies, recursion, forward references.
      - name: dart2tinygo build (top_level_functions golden case)
        working-directory: packages/dart2tinygo
        run: dart run bin/dart2tinygo.dart build test/golden/top_level_functions.dart -o /tmp/dart2tinygo-funcs-out
      - name: tinygo build -target=${{ matrix.target }} (top_level_functions)
        working-directory: /tmp/dart2tinygo-funcs-out
        run: tinygo build -target=${{ matrix.target }} -o firmware.bin .
      # Exercises a user enum: declaration, .name, .index, ==, switch.
      - name: dart2tinygo build (enum golden case)
        working-directory: packages/dart2tinygo
        run: dart run bin/dart2tinygo.dart build test/golden/enum.dart -o /tmp/dart2tinygo-enum-out
      - name: tinygo build -target=${{ matrix.target }} (enum)
        working-directory: /tmp/dart2tinygo-enum-out
        run: tinygo build -target=${{ matrix.target }} -o firmware.bin .
      # Exercises a class (no inheritance, #32): fields, a this.x
      # constructor, methods, field access/writes, instance method calls,
      # and == identity comparison.
      - name: dart2tinygo build (class_basic golden case)
        working-directory: packages/dart2tinygo
        run: dart run bin/dart2tinygo.dart build test/golden/class_basic.dart -o /tmp/dart2tinygo-class-out
      - name: tinygo build -target=${{ matrix.target }} (class_basic)
        working-directory: /tmp/dart2tinygo-class-out
        run: tinygo build -target=${{ matrix.target }} -o firmware.bin .
      # Board-specific examples only build for their own target.
      - name: dart2tinygo build (examples/hello_wioterminal)
        if: matrix.target == 'wioterminal'
        run: |
          cd packages/dart2tinygo
          dart run bin/dart2tinygo.dart build ../../examples/hello_wioterminal/main.dart -o /tmp/dart2tinygo-hello-out
      - name: tinygo build examples/hello_wioterminal
        if: matrix.target == 'wioterminal'
        working-directory: /tmp/dart2tinygo-hello-out
        run: tinygo build -target=${{ matrix.target }} -o firmware.bin .
